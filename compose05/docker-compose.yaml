version: '3.8'

networks:
  my-net:
    driver: bridge
# volume 설정
volumes:
  pgdata:          
  
services:
  my-postgres: # 서비스의 이름은 마음대로 작성 가능
    image: postgres:15
    container_name: my-postgres
    ports:
      - '5432:5432'
    environment: # 컨테이너에 환경 변수를 environment를 이용해서 전달할 수 있다.
      POSTGRES_USER: scott
      POSTGRES_PASSWORD: tiger
      POSTGRES_DB: scott_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 아래처럼 연결을 하면 컨테이너가 초기화 되는 시점에 최초1번 실행된다.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - my-net

  my-fastapi:
    build: . # 현재 경로에 있는 docker 파일을 이용해서 이미지 빌드
    image: my-fastapi:1.0
    container_name: my-fastapi
    ports:
      - "8000:8000"
    environment: # 컨테이너에 환경 변수를 environment를 이용해서 전달할 수 있다.
      DB_URL: postgresql://scott:tiger@my-postgres:5432/scott_db
    networks:
      - my-net
    volumes:
      - ./src:/app/src
    depends_on:
      - my-postgres
